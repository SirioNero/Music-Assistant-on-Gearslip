name: Server MA

# Il server di Music Assistant dentro Xonos (cartella server/): compila la build di prova e la release
# con il server (Python 3.13 con Chaquopy, Music Assistant, ffmpeg compilato per Android), le installa su
# un emulatore e le prova (tools/server/emulator.sh): il server da solo, provato da fuori con
# tools/server/check.py (primo account, una cartella con un album di toni, un lettore Sendspin come
# quello di Xonos, audio), poi Xonos stesso che lo usa e suona, nella build di prova e nella release.
# Registro del server, logcat e risultato finiscono nel riferimento nascosto
# refs/xonos/server/<ramo con - al posto di />:
#   git fetch origin refs/xonos/server/claude-server-ma && git archive FETCH_HEAD | tar -x -C <cartella>

on:
  push:
    branches: ["claude/**"]
    # Xonos-server.apk è tutta l'app più il server: la prova vale per ogni cambio all'app.
    paths:
      - "server/**"
      - "tools/server/**"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    concurrency:
      group: server-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OUT: ${{ github.workspace }}/server-out
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5

      - name: Prepara Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy vuole sulla macchina lo stesso Python che mette nell'app.
      - name: Prepara Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # ffmpeg e librespot si compilano in qualche minuto per ABI: si tengono finché lo script non cambia.
      - name: ffmpeg già compilato
        uses: actions/cache@v4
        with:
          path: server/build/ffmpeg
          key: ffmpeg-${{ hashFiles('server/ffmpeg/build.sh') }}

      - name: librespot già compilato
        uses: actions/cache@v4
        with:
          path: server/build/librespot
          key: librespot-${{ hashFiles('server/librespot/build.sh') }}

      # Anche la release, ridotta con R8 come quella che si pubblica: firmata con la chiave di debug, così
      # si installa sull'emulatore.
      - name: Compila la build di prova e la release
        env:
          XONOS_DEBUG_SIGNING: "true"
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK"
          gradle :app:assembleDebug :app:assembleRelease -PxonosServer --no-daemon --stacktrace 2>&1 | tee "$OUT/build.log"
          ls -la app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          APK=app/build/outputs/apk/release/app-release.apk
          # Dimensione vera e compressa di ciò che pesa: le librerie e Python. In fondo l'APK intero.
          unzip -v "$APK" | awk '$8 ~ /^(lib|assets\/chaquopy)\// {print $1, $3, $8}' | sort -k3 | tee "$OUT/apk.txt"
          stat -c "%s $APK" "$APK" | tee -a "$OUT/apk.txt"

      - name: Riassumi gli errori
        if: failure()
        run: |
          errors=$(grep -E "^e: |error:|ERROR|What went wrong" -A3 "$OUT/build.log" | head -n 80 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          if [ -n "$errors" ]; then echo "::error title=Compilazione non riuscita::$errors"; fi

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install -q aiohttp

      - name: Prova sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: bash tools/server/emulator.sh

      - name: Pubblica in refs/xonos/server
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$OUT"
          cd "$OUT"
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Server MA di ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/xonos/server/${GITHUB_REF_NAME//\//-}"
