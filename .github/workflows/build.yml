name: Compila Xonos

on:
  push:
    branches: ["**"]
    # Appunti, README e strumenti di prova non cambiano l'app: non serve compilarla.
    paths-ignore: ["**.md", "tools/**", "fastlane/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v5
        with:
          # Tutta la storia, per vedere se il push ha cambiato l'app.
          fetch-depth: 0

      # Dal telefono non si possono caricare cartelle: si carica Xonos.zip
      # e questo passaggio lo scompatta nel repository, al posto dello zip.
      - name: Estrai Xonos.zip, se presente
        if: github.event_name != 'pull_request'
        run: |
          if [ -f Xonos.zip ]; then
            unzip -q -o Xonos.zip -d /tmp/xonos
            cp -r /tmp/xonos/Xonos/. .
            git rm -q --cached --ignore-unmatch Xonos.zip
            rm -f Xonos.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Aggiorna il progetto da Xonos.zip"
              git push
            fi
          fi

      - name: Controlla il progetto
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "Manca il progetto: carica Xonos.zip nel repository."
            exit 1
          fi

      - name: Prepara Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Va bene anche la chiave di Plancia (secret PLANCIA_KEYSTORE): l'alias si legge dalla chiave stessa.
      # La password sta solo nel secret XONOS_KEYSTORE_PASSWORD: repository e log sono pubblici, quindi non
      # si scrive nei file e non passa da GITHUB_ENV (un secret nei log diventa ***, una variabile no).
      - name: Prepara la chiave di firma
        env:
          XONOS_KEYSTORE: ${{ secrets.XONOS_KEYSTORE }}
          PLANCIA_KEYSTORE: ${{ secrets.PLANCIA_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.XONOS_KEYSTORE_PASSWORD }}
        run: |
          KEY="${XONOS_KEYSTORE:-$PLANCIA_KEYSTORE}"
          if [ -z "$KEY" ]; then
            echo "::notice title=Firma::Nessuna chiave di firma (secret XONOS_KEYSTORE o PLANCIA_KEYSTORE): compilo senza pubblicare."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Chiave di firma::Manca il secret XONOS_KEYSTORE_PASSWORD, la password della chiave."
            exit 1
          fi
          echo "$KEY" | base64 -d > app/xonos.keystore
          ALIAS=$(keytool -list -keystore app/xonos.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -E "PrivateKeyEntry" | head -n 1 | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            echo "::error title=Chiave di firma::Non riesco ad aprire la chiave: controlla il secret XONOS_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "XONOS_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "::notice title=Firma::Chiave trovata (alias $ALIAS)."

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compila l'APK
        env:
          XONOS_KEYSTORE_PASSWORD: ${{ secrets.XONOS_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Gli errori diventano un'annotazione della compilazione, leggibile senza scaricare il log.
      - name: Riassumi gli errori
        if: failure()
        run: |
          errors=$(grep -E "^e: |error:|What went wrong" -A3 build.log | head -n 80 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
          if [ -n "$errors" ]; then echo "::error title=Compilazione non riuscita::$errors"; fi

      # Un push che cambia solo il workflow o gli strumenti non è un aggiornamento dell'app.
      - name: Controlla se l'app è cambiata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null \
            && git diff --quiet "$BEFORE" HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties gradle; then
            echo "APP_CHANGED=false" >> "$GITHUB_ENV"
            echo "::notice title=Release::L'app non è cambiata: niente release."
          fi

      # La versione è scritta in app/build.gradle.kts e va alzata a ogni pubblicazione: la release ha il tag
      # v<versionName>, lo stesso da cui compila F-Droid. Se il tag c'è già, l'app cambiata non si pubblica.
      - name: Leggi la versione
        if: env.SIGNED == 'true' && env.APP_CHANGED != 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error title=Versione::La release v$VERSION c'è già: alza versionCode e versionName in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Le note della release: quelle per F-Droid di questa versione, in inglese e in italiano.
          for LANG in en-US it-IT; do
            NOTE="fastlane/metadata/android/$LANG/changelogs/$CODE.txt"
            [ -f "$NOTE" ] && { cat "$NOTE"; echo; } >> notes.md
          done
          cat >> notes.md <<'NOTE'
          Install `Xonos.apk`. `xonos-server-arm64-v8a.zip` is Music Assistant for the phone itself: Xonos downloads it on its own, only when you tap "Make Xonos your Music Assistant server" in the settings, and checks that it's signed like Xonos.

          Installa `Xonos.apk`. `xonos-server-arm64-v8a.zip` è Music Assistant per il telefono stesso: lo scarica Xonos da solo, solo quando tocchi "Fai diventare Xonos il tuo server Music Assistant" nelle impostazioni, e controlla che sia firmato come Xonos. In auto Xonos è tra le app musicali di Gearslip e di myCar.
          NOTE

      # Solo il ramo main pubblica una release: gli altri rami si compilano per controllo.
      - name: Rinomina l'APK
        if: env.SIGNED == 'true' && env.APP_CHANGED != 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/Xonos.apk

      # Music Assistant sul telefono: il pacchetto che Xonos scarica su richiesta (server/package), solo per la
      # release (VERSION c'è solo allora) e solo arm64, i telefoni. Firmato con la chiave di Xonos: l'app lo usa
      # solo se è firmato come lei. Serve Python 3.13 come quello del pacchetto; ffmpeg e librespot si compilano
      # con l'NDK e Rust della macchina e si tengono finché gli script non cambiano. Se non si costruisce, la
      # release non parte: app e pacchetto escono insieme.
      - name: Prepara Python 3.13
        if: env.VERSION != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: ffmpeg già compilato
        if: env.VERSION != ''
        uses: actions/cache@v4
        with:
          path: server/build/ffmpeg
          key: ffmpeg-arm64-v8a-${{ hashFiles('server/ffmpeg/build.sh') }}

      - name: librespot già compilato
        if: env.VERSION != ''
        uses: actions/cache@v4
        with:
          path: server/build/librespot
          key: librespot-arm64-v8a-${{ hashFiles('server/librespot/build.sh') }}

      - name: Costruisci e firma il pacchetto di Music Assistant
        if: env.VERSION != ''
        env:
          XONOS_KEYSTORE_PASSWORD: ${{ secrets.XONOS_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if ! gradle :server:assembleRelease -PxonosServerAbis=arm64-v8a --no-daemon --stacktrace > build-server.log 2>&1; then
            tail -n 200 build-server.log
            errors=$(grep -E "^e: |error:|ERROR|What went wrong" -A3 build-server.log | head -n 80 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g') || true
            echo "::error title=Pacchetto di Music Assistant non costruito::$errors"
            exit 1
          fi
          PACKAGE=$(sed -n 's/^xonosServerPackage=//p' gradle.properties)
          ZIP=apk/xonos-server-arm64-v8a.zip
          python3 server/package/make_payload.py --aar server/build/outputs/aar/server-release.aar --abi arm64-v8a \
            --ndk "$ANDROID_NDK" --version "$PACKAGE" --out "$ZIP"
          keytool -importkeystore -noprompt -srckeystore app/xonos.keystore -srcstorepass "$XONOS_KEYSTORE_PASSWORD" \
            -srcalias "$XONOS_KEY_ALIAS" -destkeystore /tmp/xonos.p12 -deststoretype PKCS12 \
            -deststorepass "$XONOS_KEYSTORE_PASSWORD" -destkeypass "$XONOS_KEYSTORE_PASSWORD"
          openssl pkcs12 -in /tmp/xonos.p12 -passin env:XONOS_KEYSTORE_PASSWORD -nocerts -nodes -out /tmp/xonos.pem
          openssl dgst -sha256 -sign /tmp/xonos.pem -out "$ZIP.sig" "$ZIP"
          rm -f /tmp/xonos.p12 /tmp/xonos.pem
          ls -l apk

      - name: Pubblica la release
        if: env.SIGNED == 'true' && env.APP_CHANGED != 'false' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          # Il tag è la versione dell'app (versionName in app/build.gradle.kts): Obtainium li confronta.
          tag_name: v${{ env.VERSION }}
          name: Xonos ${{ env.VERSION }}
          body_path: notes.md
          files: |
            apk/*.apk
            apk/*.zip
            apk/*.sig
