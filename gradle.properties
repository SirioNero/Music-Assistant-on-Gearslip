org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Le ABI della versione con Music Assistant sul telefono (server/): i telefoni (arm64) e l'emulatore delle
# prove (x86_64); Python 3.13 per Android c'è solo a 64 bit. La release mette solo arm64-v8a
# (-PxonosServerAbis=arm64-v8a): l'APK pesa molto meno.
xonosServerAbis=arm64-v8a,x86_64
