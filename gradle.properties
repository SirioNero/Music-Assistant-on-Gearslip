org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Music Assistant sul telefono (server/): le ABI per cui si costruisce il pacchetto, i telefoni (arm64) e
# l'emulatore delle prove (x86_64; Python 3.13 per Android c'è solo a 64 bit), e la sua versione, che l'app
# confronta con quella scaricata. Si alza quando cambia il server (Music Assistant, i pacchetti, xonos_server.py).
xonosServerAbis=arm64-v8a,x86_64
xonosServerPackage=2.10.8-3
